<VirtualHost *:80>
    ServerName vmcalculator
    DocumentRoot /var/www/html/vm-calculator
    DirectoryIndex index.html

    <Directory /var/www/html/vm-calculator>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy /api/* requests to Flask on port 5000
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/
</VirtualHost>
