<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VM Calculator - Log in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      VM Calculator
    </div>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">← Back to the calculator</a>
    </nav>
  </header>

  <div class="hero-area" style="max-width:460px;margin:2rem auto">
    <div class="form-panel">
      <div class="form-panel-title" id="formTitle">Log in</div>

      <form id="authForm" novalidate>
        <div class="form-grid" style="grid-template-columns:1fr">
          <div class="form-group" id="nameGroup" style="display:none">
            <label for="name">Name</label>
            <input type="text" id="name" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" />
            <span class="error-msg" id="hint"></span>
          </div>
        </div>
        <span class="error-msg" id="formErr" style="display:block;margin-bottom:0.75rem"></span>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
          <button type="button" class="btn btn-ghost" id="switchBtn">Create an account</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="js/app.js"></script>
  <script>
    const API = '/api/auth';
    let mode = 'login';   // 'login' or 'register'

    function setMode(m) {
      mode = m;
      const reg = m === 'register';
      document.getElementById('formTitle').textContent = reg ? 'Create an account' : 'Log in';
      document.getElementById('submitBtn').textContent = reg ? 'Create account' : 'Log in';
      document.getElementById('switchBtn').textContent = reg ? 'I already have an account' : 'Create an account';
      document.getElementById('nameGroup').style.display = reg ? 'flex' : 'none';
      document.getElementById('password').autocomplete = reg ? 'new-password' : 'current-password';
      document.getElementById('hint').textContent = reg ? 'At least 8 characters' : '';
      document.getElementById('formErr').textContent = '';
    }

    document.getElementById('switchBtn').addEventListener('click', () => {
      setMode(mode === 'login' ? 'register' : 'login');
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('formErr');
      err.textContent = '';

      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };
      if (mode === 'register') body.name = document.getElementById('name').value.trim();

      try {
        const res = await fetch(`${API}/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          location.href = 'index.html';
          return;
        }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || 'Something went wrong. Please try again.';
      } catch {
        err.textContent = 'Could not reach the server.';
      }
    });
  </script>
</body>
</html>
